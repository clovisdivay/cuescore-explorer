<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CueScore - Tournois & Matchs</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            billiard: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#0f3a24',
              950: '#071d12',
            },
            felt: {
              dark: '#080f0c',
              card: '#11221a',
              border: '#1f3a2d',
              accent: '#10b981'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #070d0a;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }

    .glass-panel {
      background: rgba(17, 34, 26, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(31, 58, 45, 0.85);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #070d0a;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f3a2d;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #10b981;
    }

    .custom-gradient-text {
      background: linear-gradient(135deg, #34d399 0%, #10b981 50%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes pulse-emerald {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    .badge-live {
      animation: pulse-emerald 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Liste des tournois préconfigurés (IDs officiels)
    const KNOWN_TOURNAMENTS = [
      {
        id: "88770526",
        name: "Bretagne - Blackball - DR4C - Equipes",
        organizer: "Ligue de Billard de Bretagne (FFB)"
      },
      {
        id: "88770529",
        name: "Bretagne - Blackball - DR4D - Equipes",
        organizer: "Ligue de Billard de Bretagne (FFB)"
      },
      {
        id: "88770475",
        name: "Bretagne - Blackball - DR4E - Equipes",
        organizer: "Ligue de Billard de Bretagne (FFB)"
      },
    ];

    function parseCueScoreJson(rawData) {
      if (!rawData || typeof rawData !== 'object') {
        throw new Error("Format JSON invalide ou vide.");
      }

      // 1. Informations Tournoi
      const tObj = rawData.tournament || rawData.data || rawData;
      const tId = tObj.id || rawData.id || "";
      
      const tournamentInfo = {
        id: tId,
        name: tObj.name || tObj.title || rawData.name || `Tournoi #${tId}`,
        organizer: tObj.organizer || tObj.club || tObj.association || "Organisateur CueScore",
        venue: tObj.venue || tObj.location || tObj.place || "Lieu non précisé",
        city: tObj.city || tObj.placename || tObj.address || "",
        discipline: tObj.discipline || tObj.game || tObj.type || "Billard",
        startDate: tObj.startDate || tObj.start_date || "",
        endDate: tObj.endDate || tObj.end_date || "",
        cuescoreUrl: tObj.cuescoreUrl || tObj.url || `https://cuescore.com/tournament/?id=${tId}`
      };

      // 2. Extraire la liste brute des matchs
      let rawMatches = [];
      if (Array.isArray(rawData.matches)) {
        rawMatches = rawData.matches;
      } else if (Array.isArray(rawData.games)) {
        rawMatches = rawData.games;
      } else if (Array.isArray(rawData)) {
        rawMatches = rawData;
      } else if (rawData.rounds && Array.isArray(rawData.rounds)) {
        rawData.rounds.forEach(r => {
          if (Array.isArray(r.matches)) rawMatches.push(...r.matches);
        });
      }

      // 3. Normaliser les matchs
      const normalizedMatches = rawMatches.map((m, index) => {
        const matchId = m.id || m.matchId || `match-${index}`;
        const cuescoreMatchUrl = m.cuescoreUrl || m.url || `https://cuescore.com/match/?matchId=${matchId}`;

        const pA = m.playerA || m.team1 || {};
        const teamAName = pA.name || m.playerA_name || m.team1name || m.player1name || "Équipe A";
        const teamAId = pA.teamId || pA.id || m.team1Id || null;
        const teamAUrl = pA.url || (teamAId ? `https://cuescore.com/team/${encodeURIComponent(teamAName)}/${teamAId}` : `https://cuescore.com/search?q=${encodeURIComponent(teamAName)}`);
        const playerAName = pA.player || m.player1?.name || m.p1_name || "";

        const pB = m.playerB || m.team2 || {};
        const teamBName = pB.name || m.playerB_name || m.team2name || m.player2name || "Équipe B";
        const teamBId = pB.teamId || pB.id || m.team2Id || null;
        const teamBUrl = pB.url || (teamBId ? `https://cuescore.com/team/${encodeURIComponent(teamBName)}/${teamBId}` : `https://cuescore.com/search?q=${encodeURIComponent(teamBName)}`);
        const playerBName = pB.player || m.player2?.name || m.p2_name || "";

        const tableObj = m.table || {};
        const venueObj = tableObj.venue || m.venue || {};

        const tableName = tableObj.name || (tableObj.tableId ? `Table ${tableObj.tableId}` : (m.location || "Table d'arbitrage"));
        const venueName = venueObj.name || (typeof m.venue === 'string' ? m.venue : (tournamentInfo.venue || "Salle Principale"));
        const placename = venueObj.placename || tournamentInfo.city || "";
        const address = venueObj.address || (placename ? `${venueName}, ${placename}` : venueName);

        const scoreA = m.scoreA !== undefined ? Number(m.scoreA) : (m.score1 !== undefined ? Number(m.score1) : 0);
        const scoreB = m.scoreB !== undefined ? Number(m.scoreB) : (m.score2 !== undefined ? Number(m.score2) : 0);

        const starttime = m.starttime || m.start_time || m.dateTime || m.date || "";

        const isFinished = m.finished === true || m.finished === 1 || m.finished === "1" || m.status === "finished";
        const isRunning = m.status === "running" || m.status === "in_progress" || m.status === "live";

        let status = "upcoming";
        if (isFinished) status = "finished";
        else if (isRunning) status = "running";

        return {
          id: matchId,
          cuescoreUrl: cuescoreMatchUrl,
          roundName: m.roundName || m.round_name || m.round || (m.round ? `Round ${m.round}` : "Match"),
          starttime: starttime,
          table: {
            id: tableObj.tableId || null,
            name: tableName,
            venue: {
              id: venueObj.venueId || null,
              name: venueName,
              placename: placename,
              address: address
            }
          },
          playerA: {
            id: teamAId,
            name: teamAName,
            url: teamAUrl,
            player: playerAName
          },
          playerB: {
            id: teamBId,
            name: teamBName,
            url: teamBUrl,
            player: playerBName
          },
          scoreA: scoreA,
          scoreB: scoreB,
          finished: isFinished,
          status: status
        };
      });

      return {
        tournament: tournamentInfo,
        matches: normalizedMatches
      };
    }

    function formatFrenchDateTime(dateString) {
      if (!dateString) return { dateStr: "Date non communiquée", timeStr: "--:--", rawDate: null };
      
      const parsed = new Date(dateString);
      if (isNaN(parsed.getTime())) {
        return { dateStr: dateString, timeStr: "--:--", rawDate: null };
      }

      const dateStr = parsed.toLocaleDateString('fr-FR', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });

      const formattedDate = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);

      const timeStr = parsed.toLocaleTimeString('fr-FR', {
        hour: '2-digit',
        minute: '2-digit'
      }).replace(':', 'h');

      return {
        dateStr: formattedDate,
        timeStr: timeStr,
        rawDate: parsed
      };
    }

    function App() {
      // États principaux
      const [knownTournaments, setKnownTournaments] = useState(KNOWN_TOURNAMENTS);
      const [currentTournamentId, setCurrentTournamentId] = useState("88770526");
      const [customIdInput, setCustomIdInput] = useState("");
      const [data, setData] = useState(null);
      const [isLoadingTournament, setIsLoadingTournament] = useState(false);
      const [apiError, setApiError] = useState(null);
      const [apiSuccessMsg, setApiSuccessMsg] = useState(null);

      // Équipe favorite enregistrée en localStorage
      const [favTeam, setFavTeam] = useState(() => {
        return localStorage.getItem('cuescore_fav_team') || "THORIGNE FOUILLARD 7 DR4";
      });
      
      // Filtre d'équipe actuellement actif
      const [selectedTeam, setSelectedTeam] = useState(favTeam);

      const [selectedVenue, setSelectedVenue] = useState("");
      const [selectedPlayer, setSelectedPlayer] = useState("");
      const [selectedStatus, setSelectedStatus] = useState("ALL");
      const [searchTerm, setSearchTerm] = useState("");
      const [viewMode, setViewMode] = useState("grid"); // 'grid' | 'timeline'

      // Modale
      const [selectedMatchModal, setSelectedMatchModal] = useState(null);

      // Auto-résolution intelligente du nom de l'équipe à partir des données chargées
      useEffect(() => {
        if (data && data.matches && favTeam) {
          const cleanFav = favTeam.trim().toLowerCase();
          const teamsSet = new Set();
          data.matches.forEach(m => {
            if (m.playerA?.name) teamsSet.add(m.playerA.name);
            if (m.playerB?.name) teamsSet.add(m.playerB.name);
          });
          const allTeams = Array.from(teamsSet);
          // Match exact ou partiel
          const match = allTeams.find(t => t.toLowerCase().includes(cleanFav) || cleanFav.includes(t.toLowerCase()));
          if (match) {
            setSelectedTeam(match);
          } else {
            setSelectedTeam(favTeam);
          }
        }
      }, [data, favTeam]);

      const handleTeamChange = (teamName) => {
        setSelectedTeam(teamName);
      };

      const toggleFavoriteTeam = (teamName) => {
        if (!teamName) return;
        if (favTeam === teamName) {
          localStorage.removeItem('cuescore_fav_team');
          setFavTeam("");
        } else {
          localStorage.setItem('cuescore_fav_team', teamName);
          setFavTeam(teamName);
        }
      };

      const handleResetFilters = () => {
        setSelectedTeam(""); // Réinitialise l'affichage sans détruire le favori en localStorage !
        setSelectedVenue("");
        setSelectedPlayer("");
        setSelectedStatus("ALL");
        setSearchTerm("");
      };

      const handleApplyFavorite = () => {
        if (!favTeam) return;
        const cleanFav = favTeam.trim().toLowerCase();
        const match = availableTeams.find(t => t.toLowerCase().includes(cleanFav) || cleanFav.includes(t.toLowerCase()));
        setSelectedTeam(match || favTeam);
      };

      const loadTournamentById = async (idToLoad) => {
        if (!idToLoad) return;
        const cleanId = idToLoad.toString().trim();
        setCurrentTournamentId(cleanId);
        setIsLoadingTournament(true);
        setApiError(null);
        setApiSuccessMsg(null);

        const targetUrl = `https://api.cuescore.com/tournament/?id=${encodeURIComponent(cleanId)}`;
        const fetchUrls = [
          targetUrl,
          `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
        ];

        let loadedData = null;

        for (const url of fetchUrls) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);

            const res = await fetch(url, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (res.ok) {
              const json = await res.json();
              if (json && (json.id || json.tournament || json.matches || Array.isArray(json))) {
                loadedData = parseCueScoreJson(json);
                break;
              }
            }
          } catch (e) {
            // Passer au suivant en cas d'erreur réseau / CORS
          }
        }

        if (loadedData) {
          setData(loadedData);
          setApiSuccessMsg(`Données chargées en direct depuis l'API CueScore (Tournoi #${cleanId} - ${loadedData.matches.length} matchs trouvés).`);
        } else {
          setData(null);
          setApiError(`Impossible de récupérer les données pour le tournoi #${cleanId}. L'API distante n'a pas répondu ou l'identifiant est inexistant.`);
        }

        setIsLoadingTournament(false);
      };

      // Chargement initial
      useEffect(() => {
        loadTournamentById("88770526");
      }, []);

      const handleAddCustomId = (e) => {
        e.preventDefault();
        if (customIdInput.trim()) {
          loadTournamentById(customIdInput.trim());
          setCustomIdInput("");
        }
      };

      // Listes uniques pour les filtres
      const availableTeams = useMemo(() => {
        if (!data || !data.matches) return [];
        const teamsSet = new Set();
        data.matches.forEach(m => {
          if (m.playerA?.name) teamsSet.add(m.playerA.name);
          if (m.playerB?.name) teamsSet.add(m.playerB.name);
        });
        if (selectedTeam) teamsSet.add(selectedTeam);
        return Array.from(teamsSet).sort();
      }, [data, selectedTeam]);

      const availableVenues = useMemo(() => {
        if (!data || !data.matches) return [];
        const venueSet = new Set();
        data.matches.forEach(m => {
          const vName = m.table?.venue?.name;
          const pName = m.table?.venue?.placename;
          if (vName) {
            venueSet.add(pName ? `${vName} (${pName})` : vName);
          }
        });
        return Array.from(venueSet).sort();
      }, [data]);

      const availablePlayers = useMemo(() => {
        if (!data || !data.matches) return [];
        const playersSet = new Set();
        data.matches.forEach(m => {
          const inTeamA = !selectedTeam || m.playerA?.name === selectedTeam;
          const inTeamB = !selectedTeam || m.playerB?.name === selectedTeam;

          if (inTeamA && m.playerA?.player) playersSet.add(m.playerA.player);
          if (inTeamB && m.playerB?.player) playersSet.add(m.playerB.player);
        });
        return Array.from(playersSet).sort();
      }, [data, selectedTeam]);

      const filteredMatches = useMemo(() => {
        if (!data || !data.matches) return [];

        return data.matches
          .filter(match => {
            if (selectedTeam) {
              const cleanTeam = selectedTeam.trim().toLowerCase();
              const teamAName = (match.playerA?.name || "").trim().toLowerCase();
              const teamBName = (match.playerB?.name || "").trim().toLowerCase();

              const isTeamA = teamAName.includes(cleanTeam) || cleanTeam.includes(teamAName);
              const isTeamB = teamBName.includes(cleanTeam) || cleanTeam.includes(teamBName);

              if (!isTeamA && !isTeamB) return false;
            }

            if (selectedVenue) {
              const vName = match.table?.venue?.name || "";
              const pName = match.table?.venue?.placename || "";
              const combined = pName ? `${vName} (${pName})` : vName;
              if (combined !== selectedVenue && !vName.includes(selectedVenue)) return false;
            }

            if (selectedPlayer) {
              const isPlayerA = match.playerA?.player === selectedPlayer;
              const isPlayerB = match.playerB?.player === selectedPlayer;
              if (!isPlayerA && !isPlayerB) return false;
            }

            if (selectedStatus !== "ALL") {
              if (match.status !== selectedStatus) return false;
            }

            if (searchTerm.trim() !== "") {
              const term = searchTerm.toLowerCase();
              const matchText = `
                ${match.playerA?.name || ''} ${match.playerA?.player || ''} 
                ${match.playerB?.name || ''} ${match.playerB?.player || ''} 
                ${match.table?.venue?.name || ''} ${match.table?.venue?.placename || ''} 
                ${match.table?.venue?.address || ''} ${match.table?.name || ''} ${match.roundName || ''}
              `.toLowerCase();
              if (!matchText.includes(term)) return false;
            }

            return true;
          })
          .sort((a, b) => {
            const dateA = new Date(a.starttime).getTime();
            const dateB = new Date(b.starttime).getTime();
            
            // Les dates absentes, invalides ou indéfinies sont envoyées à la fin de la liste
            const timeA = isNaN(dateA) || dateA === 0 ? Infinity : dateA;
            const timeB = isNaN(dateB) || dateB === 0 ? Infinity : dateB;
            
            return timeA - timeB;
          });
      }, [data, selectedTeam, selectedVenue, selectedPlayer, selectedStatus, searchTerm]);

      const stats = useMemo(() => {
        if (!data || !data.matches) return { total: 0, upcoming: 0, running: 0, finished: 0 };
        return {
          total: data.matches.length,
          upcoming: data.matches.filter(m => m.status === 'upcoming').length,
          running: data.matches.filter(m => m.status === 'running').length,
          finished: data.matches.filter(m => m.status === 'finished').length
        };
      }, [data]);

      return (
        <div className="min-h-screen flex flex-col bg-[#070d0a] text-slate-100">
          
          {/* Header */}
          <header className="sticky top-0 z-40 bg-[#0b1712]/95 backdrop-blur-md border-b border-felt-border shadow-2xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
              
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-700 flex items-center justify-center shadow-lg shadow-emerald-950 text-slate-950 font-black text-xl">
                  <i className="fa-solid fa-circle"></i>
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight custom-gradient-text">CueScore Explorer</h1>
                  <p className="text-xs text-slate-400">Consultation des tournois & compétitions de billard</p>
                </div>
              </div>

              {data?.tournament?.id && (
                <a
                  href={`https://cuescore.com/tournament/?id=${data.tournament.id}`}
                  target="_blank"
                  rel="noreferrer"
                  className="px-3.5 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-emerald-600 hover:bg-emerald-500 text-slate-950 transition flex items-center space-x-2 shadow"
                >
                  <i className="fa-solid fa-arrow-up-right-from-square"></i>
                  <span className="hidden sm:inline">Voir sur</span>
                  <span>CueScore.com</span>
                </a>
              )}

            </div>
          </header>

          {/* Contenu principal */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            {/* Sélection du tournoi */}
            <section className="glass-panel rounded-2xl p-4 sm:p-5 shadow-2xl relative z-30">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                
                <div className="flex-1 space-y-1.5">
                  <label className="block text-xs font-bold text-emerald-400 uppercase tracking-wider">
                    <i className="fa-solid fa-trophy mr-1.5"></i>
                    Sélectionner un tournoi
                  </label>
                  <select
                    value={currentTournamentId}
                    onChange={(e) => loadTournamentById(e.target.value)}
                    disabled={isLoadingTournament}
                    className="w-full bg-slate-900 border border-felt-border rounded-xl px-3.5 py-2.5 text-sm font-semibold text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-inner disabled:opacity-50"
                  >
                    {knownTournaments.map((t) => (
                      <option key={t.id} value={t.id}>
                        [#{t.id}] {t.name}
                      </option>
                    ))}
                  </select>
                </div>

                <form onSubmit={handleAddCustomId} className="space-y-1.5 md:w-80">
                  <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    <i className="fa-solid fa-magnifying-glass mr-1 text-emerald-400"></i>
                    Interroger un ID CueScore
                  </label>
                  <div className="flex items-center space-x-2">
                    <input
                      type="text"
                      value={customIdInput}
                      onChange={(e) => setCustomIdInput(e.target.value)}
                      placeholder="Ex: 88770526"
                      className="w-full bg-slate-900 border border-felt-border rounded-xl px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono"
                    />
                    <button
                      type="submit"
                      disabled={!customIdInput.trim() || isLoadingTournament}
                      className="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-slate-950 font-bold rounded-xl text-xs whitespace-nowrap transition"
                    >
                      {isLoadingTournament ? <i className="fa-solid fa-spinner fa-spin"></i> : "Charger"}
                    </button>
                  </div>
                </form>

              </div>

              {/* Messages de Statut & Erreur */}
              {isLoadingTournament && (
                <div className="mt-3 p-3 bg-emerald-950/40 border border-emerald-800/50 rounded-xl text-emerald-300 text-xs flex items-center space-x-2 animate-pulse">
                  <i className="fa-solid fa-spinner fa-spin text-emerald-400"></i>
                  <span>Interrogation de l'API CueScore pour le tournoi #{currentTournamentId}...</span>
                </div>
              )}

              {apiError && !isLoadingTournament && (
                <div className="mt-3 p-3 bg-red-950/80 border border-red-800 rounded-xl text-red-200 text-xs flex items-center space-x-2">
                  <i className="fa-solid fa-circle-xmark text-red-400 text-base"></i>
                  <span className="font-medium">{apiError}</span>
                </div>
              )}

              {apiSuccessMsg && !apiError && !isLoadingTournament && (
                <div className="mt-3 p-3 bg-emerald-950/70 border border-emerald-800/80 rounded-xl text-emerald-200 text-xs flex items-center space-x-2">
                  <i className="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
                  <span>{apiSuccessMsg}</span>
                </div>
              )}
            </section>

            {/* Bannière du Tournoi Chargé */}
            {data && data.tournament && (
              <section className="relative overflow-hidden rounded-2xl bg-gradient-to-r from-felt-card via-[#12281d] to-felt-card border border-felt-border p-6 shadow-xl">
                <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
                  
                  <div className="space-y-2">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="px-2.5 py-0.5 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-md text-xs font-semibold uppercase">
                        {data.tournament.discipline || "Billard"}
                      </span>
                      <span className="px-2.5 py-0.5 bg-slate-800 text-slate-300 border border-slate-700 rounded-md text-xs font-mono">
                        ID: #{data.tournament.id}

                <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800/80">
                  <div className="flex flex-wrap items-center gap-2">
                    <a
                      href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selectedMatchModal.table?.venue?.address || selectedMatchModal.table?.venue?.name)}`}
                      target="_blank"
                      rel="noreferrer"
                      className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition"
                    >
                      <i className="fa-solid fa-location-arrow text-emerald-400"></i>
                      <span>Google Maps</span>
                    </a>

                    <a
                      href={selectedMatchModal.cuescoreUrl || `https://cuescore.com/match/?matchId=${selectedMatchModal.id}`}
                      target="_blank"
                      rel="noreferrer"
                      className="px-3 py-2 bg-emerald-950/90 hover:bg-emerald-900/90 text-emerald-300 border border-emerald-700/60 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition shadow"
                    >
                      <i className="fa-solid fa-trophy text-emerald-400"></i>
                      <span>Match CueScore</span>
                      <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                    </a>
                  </div>

                  <button
                    onClick={() => setSelectedMatchModal(null)}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs transition"
                  >
                    Fermer
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="border-t border-felt-border bg-[#040806] py-4 text-center text-xs text-slate-500">
            <p>CueScore Explorer • Visualiseur non officiel de matchs & compétitions de billard</p>
          </footer>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
